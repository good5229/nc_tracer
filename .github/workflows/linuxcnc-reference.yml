name: LinuxCNC reference interpreter
on: workflow_dispatch
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the standalone LinuxCNC interpreter
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends linuxcnc-uspace coreutils
      - name: Interpret the public demos with a synthetic tool table
        shell: bash
        run: |
          mkdir -p /tmp/linuxcnc-reference
          printf "[TRAJ]\nLINEAR_UNITS = mm\n" > /tmp/reference.ini
          for diameter in 0 1.016 1.5875; do
            cat > /tmp/reference-tool.tbl <<TOOLS
          T1 P1 Z0 D${diameter} Q0
          T2 P2 Z0 D0.5 Q0
          T4 P4 Z0 D0.5 Q0
          T9 P9 Z0 D0.5 Q0
          T10 P10 Z0 D0.5 Q0
          TOOLS
            for file in demo/*.ngc; do
              name=$(basename "$file")
              output="/tmp/linuxcnc-reference/${name}-diameter-${diameter}.txt"
              echo "--- $name, T1 D${diameter} ---"
              if timeout 30s rs274 -i /tmp/reference.ini -g -t /tmp/reference-tool.tbl "$file" > "$output" 2>&1; then
                echo "interpreter exit: 0"
              else
                echo "interpreter exit: $?"
              fi
              wc -l "$output"
              tail -5 "$output"
            done
          done
      - name: Upload public reference traces
        uses: actions/upload-artifact@v4
        with:
          name: linuxcnc-reference-traces
          path: /tmp/linuxcnc-reference/*.txt
          retention-days: 7
